<script>

const API_URL =
  "https://viralforge-backend-nl1f.onrender.com";


/* =========================
   NAVIGATION
========================= */

const pageNames = {
  home: "Dashboard",
  studio: "Content Studio",
  hooks: "Hook Lab",
  ideas: "Idea Lab",
  captions: "Captions",
  score: "Viral Score",
  saved: "Saved Content",
  settings: "Settings"
};

function openPage(id) {

  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  const page = document.getElementById(id);

  if (page) {
    page.classList.add("active");
  }

  document.querySelectorAll(".nav button").forEach(btn => {
    btn.classList.toggle(
      "active",
      btn.dataset.page === id
    );
  });

  document.getElementById("pageTitle").textContent =
    pageNames[id] || id;

  if (id === "saved") {
    renderSaved();
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


document.querySelectorAll(".nav button").forEach(btn => {

  btn.onclick = () => {
    openPage(btn.dataset.page);
  };

});


/* =========================
   TOAST
========================= */

function toast(message) {

  const box = document.getElementById("toast");

  if (!box) return;

  box.textContent = message;
  box.classList.add("show");

  setTimeout(() => {
    box.classList.remove("show");
  }, 2200);
}


/* =========================
   AI REQUEST
========================= */

async function ai(type, data = {}) {

  toast("AI is working...");

  try {

    const response = await fetch(
      `${API_URL}/api/generate`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          type,
          ...data
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(
        result.error || "AI request failed."
      );
    }

    return result.result;

  } catch (error) {

    console.error(error);

    toast("AI error");

    throw error;
  }
}


/* =========================
   SCRIPTS
========================= */

async function generateScripts() {

  const topic =
    document.getElementById("topic").value.trim();

  if (!topic) {
    toast("Enter a topic first.");
    return;
  }

  try {

    const result = await ai("scripts", {

      topic,

      niche:
        document.getElementById("niche").value,

      platform:
        document.getElementById("platform").value,

      style:
        document.getElementById("style").value,

      length:
        document.getElementById("length").value,

      audience:
        document.getElementById("audience").value

    });

    const output =
      document.getElementById("scripts");

    output.innerHTML = "";

    const box =
      document.createElement("div");

    box.className = "result";

    box.textContent = result;

    output.appendChild(box);

    const actions =
      document.createElement("div");

    actions.className = "actions";

    actions.innerHTML = `
      <button class="btn" id="copyScripts">
        📋 Copy
      </button>

      <button class="btn good" id="saveScripts">
        💾 Save
      </button>

      <button class="btn" id="scoreScripts">
        📊 Score
      </button>
    `;

    output.appendChild(actions);

    document
      .getElementById("copyScripts")
      .onclick = () => copyText(result);

    document
      .getElementById("saveScripts")
      .onclick = () =>
        saveContent("AI Scripts", result);

    document
      .getElementById("scoreScripts")
      .onclick = () => {

        document.getElementById("scoreText")
          .value = result;

        openPage("score");
      };

    toast("AI scripts generated!");

  } catch {
    document.getElementById("scripts").innerHTML =
      `<div class="result">
        AI generation failed. Check your Render backend.
      </div>`;
  }
}


/* =========================
   HOOKS
========================= */

async function generateHooks() {

  const topic =
    document.getElementById("hookTopic")
      .value.trim();

  if (!topic) {
    toast("Enter a topic first.");
    return;
  }

  try {

    const result = await ai("hooks", {

      topic,

      niche:
        document.getElementById("hookNiche").value,

      platform:
        "Short-form",

      style:
        document.getElementById("hookStyle").value

    });

    document.getElementById("hookOutput")
      .innerText = result;

    toast("AI hooks generated!");

  } catch {

    document.getElementById("hookOutput")
      .innerText =
      "AI generation failed.";

  }
}


/* =========================
   IDEAS
========================= */

async function generateIdeas() {

  try {

    const result = await ai("ideas", {

      niche:
        document.getElementById("ideaNiche").value,

      platform:
        document.getElementById("ideaPlatform").value,

      goal:
        document.getElementById("ideaGoal").value

    });

    document.getElementById("ideaOutput")
      .innerHTML = `
        <div class="card full">
          <div class="result">${escapeHTML(result)}</div>

          <div class="actions">
            <button class="btn"
              onclick='copyText(${JSON.stringify(result)})'>
              📋 Copy
            </button>

            <button class="btn good"
              onclick='saveContent("AI Ideas",${JSON.stringify(result)})'>
              💾 Save
            </button>
          </div>
        </div>
      `;

    toast("AI ideas generated!");

  } catch {

    toast("AI generation failed.");

  }
}


/* =========================
   CAPTION
========================= */

async function generateCaption() {

  const topic =
    document.getElementById("captionTopic")
      .value.trim();

  if (!topic) {
    toast("Enter a topic first.");
    return;
  }

  try {

    const result = await ai("caption", {

      topic,

      tone:
        document.getElementById("captionTone").value,

      platform:
        document.getElementById("captionPlatform").value

    });

    document.getElementById("captionOutput")
      .innerText = result;

    toast("AI captions generated!");

  } catch {

    document.getElementById("captionOutput")
      .innerText =
      "AI generation failed.";

  }
}


/* =========================
   SCORE
========================= */

async function analyzeScore() {

  const text =
    document.getElementById("scoreText")
      .value.trim();

  if (!text) {
    toast("Paste content first.");
    return;
  }

  try {

    const result = await ai("score", {
      text
    });

    document.getElementById("scoreOutput")
      .innerText = result;

    const match =
      result.match(/(?:SCORE|Score)\s*:\s*(\d{1,3})/);

    if (match) {

      const score =
        Math.min(
          100,
          Number(match[1])
        );

      document.getElementById("scoreNumber")
        .innerText = score;

      document.getElementById("scoreBar")
        .style.width = score + "%";

    }

    toast("AI analysis complete!");

  } catch {

    document.getElementById("scoreOutput")
      .innerText =
      "AI analysis failed.";

  }
}


/* =========================
   COPY
========================= */

function copyText(text) {

  navigator.clipboard
    .writeText(text)
    .then(() => toast("Copied!"))
    .catch(() => toast("Copy failed."));
}


function copyElement(id) {

  const element =
    document.getElementById(id);

  if (element) {
    copyText(element.innerText);
  }
}


/* =========================
   SAVED
========================= */

function saveContent(type, text) {

  const saved =
    JSON.parse(
      localStorage.getItem(
        "viralforgeSaved"
      ) || "[]"
    );

  saved.unshift({
    type,
    text,
    date:
      new Date().toLocaleString()
  });

  localStorage.setItem(
    "viralforgeSaved",
    JSON.stringify(
      saved.slice(0, 100)
    )
  );

  toast("Saved!");
}


function saveCurrent(type, id) {

  const element =
    document.getElementById(id);

  if (element) {
    saveContent(
      type,
      element.innerText
    );
  }
}


function renderSaved() {

  const output =
    document.getElementById("savedOutput");

  const saved =
    JSON.parse(
      localStorage.getItem(
        "viralforgeSaved"
      ) || "[]"
    );

  if (!saved.length) {

    output.innerHTML =
      `<div class="result">
        Nothing saved yet.
      </div>`;

    return;
  }

  output.innerHTML =
    saved.map((item, index) => `

      <div class="history-item">

        <div>

          <b>
            ${escapeHTML(item.type)}
          </b>

          <br>

          <small class="muted">
            ${escapeHTML(item.date)}
          </small>

          <p class="muted">
            ${escapeHTML(
              item.text.substring(0, 300)
            )}
          </p>

        </div>

        <div class="actions">

          <button
            class="btn"
            onclick="copySaved(${index})">
            Copy
          </button>

          <button
            class="btn danger"
            onclick="deleteSaved(${index})">
            Delete
          </button>

        </div>

      </div>

    `).join("");
}


function copySaved(index) {

  const saved =
    JSON.parse(
      localStorage.getItem(
        "viralforgeSaved"
      ) || "[]"
    );

  copyText(saved[index].text);
}


function deleteSaved(index) {

  const saved =
    JSON.parse(
      localStorage.getItem(
        "viralforgeSaved"
      ) || "[]"
    );

  saved.splice(index, 1);

  localStorage.setItem(
    "viralforgeSaved",
    JSON.stringify(saved)
  );

  renderSaved();

  toast("Deleted.");
}


function clearSaved() {

  localStorage.removeItem(
    "viralforgeSaved"
  );

  renderSaved();

  toast("Saved content cleared.");
}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================
   RANDOM
========================= */

function surpriseMe() {

  const topics = [
    "3 mistakes beginners make in gaming",
    "how to get better at basketball",
    "a study trick that actually helps",
    "what I learned after failing",
    "3 useful phone features",
    "how to start a channel from zero",
    "a simple money habit",
    "how to make better short videos",
    "the biggest creator mistake",
    "something nobody tells beginners"
  ];

  document.getElementById("topic").value =
    topics[
      Math.floor(
        Math.random() * topics.length
      )
    ];

  openPage("studio");

  toast("Random topic loaded.");
}


function randomHook() {

  const topics = [
    "growing on YouTube",
    "getting better at basketball",
    "learning faster",
    "starting a gaming channel",
    "making better videos",
    "staying consistent",
    "getting more views"
  ];

  document.getElementById("hookTopic").value =
    topics[
      Math.floor(
        Math.random() * topics.length
      )
    ];

  generateHooks();
}


/* =========================
   START
========================= */

renderSaved();

</script>
